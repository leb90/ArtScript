# Tests, types, and the cost eval's harness with every reference app (offline: no API key).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval -- --dry-run
      - run: npm run eval -- --dry-run --stacks vue,solid
